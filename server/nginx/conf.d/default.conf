# Configuración del Reverse Proxy para Logs Anomaly Detector
# Este archivo maneja el enrutamiento a todos los servicios backend
server {
    listen 80;
    #server_name localhost;
    server_name logsanomaly.ctangarife.com;
    server_tokens off;

     location /.well-known/acme-challenge/ {
         root /var/www/certbot;
     }
     location / {
        return 301 https://$host$request_uri;
     }
}
# Upstream para Backend Python FastAPI (Anomaly Detector)
upstream anomaly-detector {
    server anomaly-detector:8000;
    keepalive 32;
}

# Configuración de rate limiting para protección DDoS
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Servidor principal
server {
    #listen 80;
    #server_name localhost;
    listen 443 ssl;
    server_name logsanomaly.ctangarife.com;
    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/logsanomaly.ctangarife.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logsanomaly.ctangarife.com-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Charset UTF-8
    charset utf-8;

    # Logs específicos de este servidor
    access_log /var/log/nginx/logsanomaly.access.log detailed;
    error_log /var/log/nginx/logsanomaly.error.log warn;

    # Headers de seguridad globales
    include /etc/nginx/includes/security-headers.conf;

    # ==================================================================
    # API Backend Python FastAPI - Análisis de Anomalías
    # ==================================================================
    
    # Todas las rutas de API van al backend Python
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://anomaly-detector/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts más largos para procesamiento de logs y streaming
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
        
        # Deshabilitar buffering para streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Soporte para archivos grandes
        client_max_body_size 100M;
    }

    # Health check para Python service
    location /api/health {
        proxy_pass http://anomaly-detector/health;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Sin rate limiting para health checks
        access_log off;
    }

    # ==================================================================
    # Frontend Vue 3 - Aplicación Web (Archivos Estáticos)
    # ==================================================================
    
    # Servir archivos estáticos del frontend (build de Vue)
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        root /usr/share/nginx/html;
        index index.html;

        # SPA - todas las rutas van a index.html
        try_files $uri $uri/ /index.html;

        # Headers de cache para HTML - DESACTIVADO EN DESARROLLO
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Assets estáticos - SIN CACHE EN DESARROLLO para evitar problemas
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        root /usr/share/nginx/html;

        # Sin cache en desarrollo
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;

        # Compression
        gzip_static on;

        # Sin logs para assets
        access_log off;
    }
    
    # Archivos del directorio assets/ - SIN CACHE en desarrollo
    location /assets/ {
        root /usr/share/nginx/html;

        # Sin cache en desarrollo
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        access_log off;
    }

    # Health check general
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }

    # ==================================================================
    # Protección y Seguridad
    # ==================================================================
    
    # Bloquear acceso directo a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso a archivos de configuración
    location ~ \.(yml|yaml|env|config|ini|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Página de error personalizada
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Servidor para health check interno (no expuesto públicamente)
server {
    listen 8080;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /stub_status {
        stub_status on;
        access_log off;
        # Permitir toda la red interna Docker (rangos comunes)
        allow 172.16.0.0/12;   # Docker bridge por defecto
        allow 192.168.0.0/16;  # Redes Docker personalizadas
        allow 10.0.0.0/8;      # Otro rango común
        deny all;
    }
}

